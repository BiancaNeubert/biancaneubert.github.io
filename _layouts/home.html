---
layout: default
---

<div class="container">

  <!-- Section: Content + smaller image -->
  <div class="row g-5 mb-5 align-items-center">
    <div class="col-md-8">
      {{ content }}
    </div>

    <div class="col-md-4">
      <img
        src="{{ site.github.url }}/assets/img/test.jpg"
        alt="Home"
        class="img-fluid"
      >
    </div>
  </div>

  <!-- Section: Full-width content after the image -->
  <div class="row g-5 mb-5">
    <div class="col-12">
      {{ content_after_image }}
    </div>
  </div>

</div>
